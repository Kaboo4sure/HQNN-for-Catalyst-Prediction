name: HQNN Catalyst Pipeline

on: 
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  run-hqnn:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        pip install -r requirements.txt
        
        # Ensure SHAP and numpy 1.x compatibility
        pip install "numpy<2"
        pip install shap==0.42.1

    - name: Run HQNN pipeline
      run: |
        python main.py

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: hqnn-results
        path: outputs/

    - name: Debug paths
      run: |
        echo "=== Debugging data paths ==="
        echo "DRM DIR in config.py:"
        grep DRM_DIR -n config.py || echo "Not found"
        echo "--- Contents of notebooks/data ---"
        ls -R notebooks/data

  
    - name: Debug paths
      run: |
        python - << 'EOF'
        from src.config import ROOT_DIR, DRM_DIR
        import os
        print("ROOT_DIR =", ROOT_DIR)
        print("DRM_DIR =", DRM_DIR)
        print("DRM Exists? ", os.path.exists(DRM_DIR))
        print("Contents:", os.listdir(DRM_DIR) if os.path.exists(DRM_DIR) else "Missing")
        EOF notebooks/data
        

